name: Refresh vulnerable dependency lock (temporary pre-PC)
on:
  push:
    branches: [chat/pre-pc-acai-20261027]

permissions:
  contents: write

jobs:
  security-update:
    if: github.repository == 'CristianoRFB/Acaiteria' && github.ref == 'refs/heads/chat/pre-pc-acai-20261027'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate locked dependency graph from pinned security floors
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate clean install and production security audit
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev
      - name: Commit patched manifests only
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes were necessary"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'fix(deps): update vulnerable dependencies within allowed semver ranges'
          git push origin HEAD:refs/heads/chat/pre-pc-acai-20261027
