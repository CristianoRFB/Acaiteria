name: Try compatible dev dependency security fixes (temporary)
on:
  push:
    branches: [chat/pre-pc-acai-20261027]
permissions:
  contents: write
jobs:
  fix:
    if: github.repository == 'CristianoRFB/Acaiteria' && github.ref == 'refs/heads/chat/pre-pc-acai-20261027'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Align lockfile npm version
        run: npm install --global npm@11 --no-fund
      - name: Clean install baseline
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply strictly non-breaking audit fixes
        run: |
          # npm audit fix exits 1 when advisories remain without a compatible
          # non-breaking fix. Preserve the remediated lockfile and let the
          # normal CI security gate report residual advisories.
          npm audit fix --no-fund --no-progress || echo "Residual advisories remain; not marking security CI green"
      - name: Verify clean install, audit and changes
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev
          git diff --stat -- package.json package-lock.json
      - name: Commit compatible lockfile changes
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'fix(ci): apply compatible patched developer dependencies'
          git push origin HEAD:refs/heads/chat/pre-pc-acai-20261027
