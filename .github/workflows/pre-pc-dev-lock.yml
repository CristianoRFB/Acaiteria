name: Refresh patched developer tooling lock (temporary pre-PC)
on:
  push:
    branches: [chat/pre-pc-acai-20261027]
permissions:
  contents: write
jobs:
  lock:
    if: github.repository == 'CristianoRFB/Acaiteria' && github.ref == 'refs/heads/chat/pre-pc-acai-20261027'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh lockfile with patched package constraints
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install and production packages
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'fix(deps): regenerate patched developer tool dependency graph'
          git push origin HEAD:refs/heads/chat/pre-pc-acai-20261027
