name: Refresh Functions lockfile (temporary pre-PC)
on:
  push:
    branches: [chat/pre-pc-acai-20261027]
permissions:
  contents: write
jobs:
  lockfile:
    if: github.repository == 'CristianoRFB/Acaiteria' && github.ref == 'refs/heads/chat/pre-pc-acai-20261027'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Refresh patched Functions graph
        run: npm install --prefix functions --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate backend installation and production audit
        run: |
          npm ci --prefix functions --ignore-scripts --no-audit --no-fund
          npm audit --prefix functions --omit=dev
      - name: Commit Functions lockfile only
        run: |
          if git diff --quiet -- functions/package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/package-lock.json
          git commit -m 'fix(functions): synchronize patched backend dependency lockfile'
          git push origin HEAD:refs/heads/chat/pre-pc-acai-20261027
