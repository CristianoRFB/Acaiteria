name: Repair root lockfile (temporary pre-PC)
on:
  push:
    branches:
      - chat/pre-pc-acai-20261027

permissions:
  contents: write

jobs:
  regenerate-lock:
    if: github.repository == 'CristianoRFB/Acaiteria' && github.ref == 'refs/heads/chat/pre-pc-acai-20261027'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile without changing declared dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Check root clean install against refreshed lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit verified lockfile only
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'fix(ci): synchronize npm lockfile with current dependency graph'
          git push origin HEAD:refs/heads/chat/pre-pc-acai-20261027
