<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6f2bc5" />
    <title>Sem conexão · Açaí Mais Sabor</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f8f7ff; color: #171521; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; min-height: 100dvh; margin: 0; padding: 24px; place-items: center; }
      main { width: min(100%, 440px); padding: 32px; border: 1px solid #e5e1ed; border-radius: 24px; background: white; box-shadow: 0 12px 36px #24143112; }
      .brand { color: #6f2bc5; font-size: .8rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
      h1 { margin: 16px 0 8px; font-size: clamp(1.6rem, 7vw, 2rem); line-height: 1.15; }
      p { color: #6f6878; line-height: 1.6; }
      a { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; margin-top: 12px; padding: 0 20px; border-radius: 999px; background: #6f2bc5; color: white; font-weight: 800; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">Açaí Mais Sabor</div>
      <h1>Você está sem conexão</h1>
      <p>Conecte-se à internet e tente novamente. Pedidos, pagamentos e entregas precisam de conexão para serem confirmados com segurança.</p>
      <a href="/">Tentar novamente</a>
    </main>
  </body>
</html>
